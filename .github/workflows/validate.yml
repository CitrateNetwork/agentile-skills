name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validation harness
        run: python3 scripts/validate.py
      - name: Skill-integrity gate (AGS-B-001)
        # Fails if any executable SKILL.md changed without a matching,
        # reviewed skills.lock update. Regenerate with
        # `scripts/check_skill_integrity.py --update` after an intentional edit.
        run: python3 scripts/check_skill_integrity.py
